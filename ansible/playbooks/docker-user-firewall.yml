---
# Docker publishes ports by writing its own iptables rules, which bypass UFW
# entirely: the Pi answers on :6060 from the LAN even though UFW has no rule for
# it. DOCKER-USER is the hook Docker leaves for exactly this, but on this Pi
# k3s's kube-router accepts forwarded traffic before FORWARD reaches it, so the
# rules that hold live in mangle (HOMELAB-PRE, HOMELAB-FWD). They confine
# container-published ports and k3s NodePorts/LoadBalancer ports to the LAN,
# the tailnet and the k3s pods.
#
# A systemd oneshot rather than iptables-persistent: the latter would also
# snapshot UFW's rules and the two fight at boot.
- name: Restrict Docker-published ports
  hosts: raspberry_pi
  become: yes
  vars:
    lan_cidr: "{{ ansible_default_ipv4.network }}/{{ ansible_default_ipv4.prefix }}"
    k3s_pod_cidr: 10.42.0.0/16
    open_design_client: 192.168.0.126

  tasks:
    - name: Install the DOCKER-USER rule script
      copy:
        dest: /usr/local/sbin/homelab-docker-user.sh
        mode: '0755'
        content: |
          #!/bin/sh
          # Confine Docker-published ports. Idempotent: drops its own rules first.
          set -e
          while iptables -D DOCKER-USER -m comment --comment "homelab-managed" 2>/dev/null; do :; done
          iptables -F DOCKER-USER 2>/dev/null || true
          iptables -A DOCKER-USER -m conntrack --ctstate RELATED,ESTABLISHED -j RETURN -m comment --comment "homelab-managed"
          iptables -A DOCKER-USER -p tcp --dport 7456 ! -s {{ open_design_client }} -j DROP -m comment --comment "homelab-managed"
          iptables -A DOCKER-USER -s {{ lan_cidr }} -j RETURN -m comment --comment "homelab-managed"
          iptables -A DOCKER-USER -s {{ k3s_pod_cidr }} -j RETURN -m comment --comment "homelab-managed"
          iptables -A DOCKER-USER -s 172.16.0.0/12 -j RETURN -m comment --comment "homelab-managed"
          iptables -A DOCKER-USER -i tailscale0 -j RETURN -m comment --comment "homelab-managed"
          iptables -A DOCKER-USER -i lo -j RETURN -m comment --comment "homelab-managed"
          iptables -A DOCKER-USER -j DROP -m comment --comment "homelab-managed"
          # k3s's kube-router accepts forwarded traffic (a mark-based accept in
          # FORWARD) before FORWARD ever jumps to DOCKER-USER, so the chain above
          # is never consulted. Rules that must hold go in mangle PREROUTING,
          # which runs before kube-router, Docker's DNAT and UFW. A chain of our
          # own keeps it idempotent without touching k3s's rules there.
          iptables -t mangle -N HOMELAB-PRE 2>/dev/null || true
          iptables -t mangle -F HOMELAB-PRE
          iptables -t mangle -C PREROUTING -j HOMELAB-PRE -m comment --comment "homelab-managed" 2>/dev/null \
            || iptables -t mangle -I PREROUTING 1 -j HOMELAB-PRE -m comment --comment "homelab-managed"
          iptables -t mangle -A HOMELAB-PRE -p tcp -d {{ ansible_default_ipv4.address }} --dport 7456 ! -s {{ open_design_client }} -j DROP -m comment --comment "homelab-managed"
          # The same LAN/tailnet/pod confinement as DOCKER-USER, enforced in
          # mangle FORWARD: after Docker's DNAT, before kube-router's filter
          # FORWARD accept. Only new connections headed into a Docker bridge
          # are checked, so container egress and host-network services are
          # untouched. cni0 covers k3s: NodePorts and ServiceLB (Traefik 80/443)
          # are DNAT'd to pods behind it, and the UFW NodePort allow never sees
          # that traffic. Only kube-system has no NetworkPolicy, but this keeps
          # every namespace confined even when one is added without a policy.
          iptables -t mangle -N HOMELAB-FWD 2>/dev/null || true
          iptables -t mangle -F HOMELAB-FWD
          for br in docker0 br-+ cni0; do
            iptables -t mangle -C FORWARD -o "$br" -m conntrack --ctstate NEW -j HOMELAB-FWD -m comment --comment "homelab-managed" 2>/dev/null \
              || iptables -t mangle -I FORWARD 1 -o "$br" -m conntrack --ctstate NEW -j HOMELAB-FWD -m comment --comment "homelab-managed"
          done
          iptables -t mangle -A HOMELAB-FWD -s {{ lan_cidr }} -j RETURN -m comment --comment "homelab-managed"
          iptables -t mangle -A HOMELAB-FWD -s {{ k3s_pod_cidr }} -j RETURN -m comment --comment "homelab-managed"
          iptables -t mangle -A HOMELAB-FWD -s 172.16.0.0/12 -j RETURN -m comment --comment "homelab-managed"
          iptables -t mangle -A HOMELAB-FWD -i tailscale0 -j RETURN -m comment --comment "homelab-managed"
          iptables -t mangle -A HOMELAB-FWD -i lo -j RETURN -m comment --comment "homelab-managed"
          iptables -t mangle -A HOMELAB-FWD -j DROP -m comment --comment "homelab-managed"
      notify: reapply docker-user rules
      tags: [docker-user]

    - name: Install the unit that applies them after Docker starts
      copy:
        dest: /etc/systemd/system/homelab-docker-user.service
        mode: '0644'
        content: |
          [Unit]
          Description=Confine Docker-published ports and k3s NodePorts to the LAN, tailnet and k3s pods
          After=docker.service
          Requires=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/homelab-docker-user.sh

          [Install]
          WantedBy=multi-user.target
      notify: reapply docker-user rules
      tags: [docker-user]

    - name: Enable it at boot
      systemd:
        name: homelab-docker-user
        enabled: yes
        state: started
        daemon_reload: yes
      tags: [docker-user]

  handlers:
    - name: reapply docker-user rules
      systemd:
        name: homelab-docker-user
        state: restarted
        daemon_reload: yes
