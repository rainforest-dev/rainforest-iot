---
# System Hardening Playbook for Homelab
- name: Harden Raspberry Pi 5 Security
  hosts: raspberry_pi
  become: yes
  vars:
    allowed_ssh_users: ["rainforest"]
    ufw_enabled: true
    # Derived from facts so no LAN address is committed to the repo.
    lan_cidr: "{{ ansible_default_ipv4.network }}/{{ ansible_default_ipv4.prefix }}"
    k3s_pod_cidr: 10.42.0.0/16
    
  tasks:
    - name: Update all packages
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        autoclean: yes
        
    - name: Install security packages
      apt:
        name:
          - ufw
          - unattended-upgrades
          - logrotate
          - rkhunter
          - chkrootkit
        state: present
        
    # SSH Hardening
    - name: Configure SSH security
      blockinfile:
        path: /etc/ssh/sshd_config
        block: |
          # Security hardening
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          AllowUsers {{ allowed_ssh_users | join(' ') }}
          Protocol 2
          MaxAuthTries 3
          ClientAliveInterval 300
          ClientAliveCountMax 2
        marker: "# {mark} ANSIBLE MANAGED SSH SECURITY"
      notify: restart ssh
      
    # Firewall Configuration
    - name: Configure UFW defaults
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }
      when: ufw_enabled
      
    # Scoped to the LAN, the tailnet and the k3s pod network. Nothing is open to
    # Anywhere: there are no router port forwards, so every legitimate source is
    # one of these three. Deleting a rule here does not remove it from a host that
    # already has it — `ufw delete` that one by hand.
    - name: Allow LAN access to host services
      ufw:
        rule: allow
        src: "{{ lan_cidr }}"
        port: "{{ item.port }}"
        proto: "{{ item.proto | default('tcp') }}"
        comment: LAN
      loop:
        - { port: '22' }        # SSH
        - { port: '80' }        # Homepage
        - { port: '8080' }      # Pi-hole
        - { port: '8123' }      # Home Assistant
        - { port: '3000' }      # OpenSpeedTest
        - { port: '3001' }      # OpenSpeedTest HTTPS
        - { port: '6443' }      # K3s API
        - { port: '8581' }      # Homebridge
        - { port: '21064' }     # HomeKit Bridge
        - { port: '53' }
        - { port: '53', proto: 'udp' }
        - { port: '30000:32767' }  # K8s NodePorts
        - { port: '8095' }      # Music Assistant web UI and API
        - { port: '8097' }      # Music Assistant stream server — Chromecast and
                                # AirPlay players fetch audio from here, so a
                                # blocked 8097 breaks playback rather than the UI
        - { port: '5353', proto: 'udp' }  # mDNS: Chromecast, AirPlay and HomeKit
                                          # discovery all depend on it
      when: ufw_enabled
      tags: [ufw]

    # Two rules added by hand at some point opened 1024-65535 tcp+udp to
    # 192.168.176.0/24 — a subnet this network has never used, so AirPlay to the
    # Pi never actually worked. Removed rather than re-pointed: nothing has been
    # relying on it, and re-pointing would open 129k ports to the whole LAN.
    # Music Assistant streaming OUT to speakers is unaffected; that is 8097.
    - name: Remove the stale AirPlay rules
      ufw:
        rule: allow
        delete: yes
        src: 192.168.176.0/24
        port: '1024:65535'
        proto: "{{ item }}"
      loop: [tcp, udp]
      when: ufw_enabled
      tags: [ufw]

    # Three narrower rules for 10.42.0.0/24 predate the /16 rule above and are
    # strictly subsumed by it — same sources, a subset of the ports. They were
    # never in this playbook.
    - name: Remove the superseded per-port pod rules
      ufw:
        rule: allow
        delete: yes
        src: 10.42.0.0/24
        port: "{{ item }}"
        proto: tcp
      loop: ['10250', '9617', '9100']
      when: ufw_enabled
      tags: [ufw]

    - name: Allow the tailnet interface
      ufw:
        rule: allow
        direction: in
        interface: tailscale0
        comment: tailnet
      when: ufw_enabled
      tags: [ufw]

    # Prometheus scrapes host ports from inside the cluster, so the source is a
    # pod address rather than a LAN one.
    - name: Allow the k3s pod network to reach the host
      ufw:
        rule: allow
        src: "{{ k3s_pod_cidr }}"
        comment: k3s pod network
      when: ufw_enabled
      tags: [ufw]

    # Pod-to-pod traffic crosses the cni0 bridge, which puts it in FORWARD, and
    # UFW's routed default is deny — so `ufw allow from <pod cidr>` above does
    # not cover it, being an INPUT rule. This was silently dropping thousands of
    # intra-cluster packets a day, blackbox-exporter's DNS queries to CoreDNS
    # among them. kube-proxy's own FORWARD rules cover NodePort traffic, which
    # is why the cluster looked healthy from outside while this was happening.
    - name: Allow forwarding for the k3s pod network
      ufw:
        rule: allow
        route: yes
        src: "{{ item.src | default(omit) }}"
        dest: "{{ item.dest | default(omit) }}"
        comment: k3s pod network (routed)
      loop:
        - { src: "{{ k3s_pod_cidr }}" }
        - { dest: "{{ k3s_pod_cidr }}" }
      when: ufw_enabled
      tags: [ufw]

    - name: Enable UFW
      ufw:
        state: enabled
        logging: 'on'
      when: ufw_enabled
      
    # Intrusion prevention: CrowdSec (Terraform module crowdsec) reading journald
    - name: Remove fail2ban
      apt:
        name: fail2ban
        state: absent
        purge: yes
      tags: [intrusion-prevention]

    - name: Remove the fail2ban config directory
      file:
        path: /etc/fail2ban
        state: absent
      tags: [intrusion-prevention]

    - name: Clear fail2ban's failed unit state
      command: systemctl reset-failed fail2ban.service
      register: fail2ban_reset
      changed_when: fail2ban_reset.rc == 0
      failed_when: false
      tags: [intrusion-prevention]

    - name: Check for a stray /var/log/auth.log
      stat:
        path: /var/log/auth.log
      register: auth_log
      tags: [intrusion-prevention]

    - name: Remove the /var/log/auth.log directory left by a Docker bind mount
      file:
        path: /var/log/auth.log
        state: absent
      when: auth_log.stat.isdir | default(false)
      tags: [intrusion-prevention]
      
    # Automatic Updates
    - name: Configure unattended upgrades
      copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        
    - name: Configure unattended upgrades settings
      copy:
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}";
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::MinimalSteps "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        
    # System Monitoring
    - name: Create system monitoring script
      copy:
        content: |
          #!/bin/bash
          # Homelab system monitoring
          echo "=== System Status $(date) ===" >> /var/log/homelab-status.log
          echo "CPU: $(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1)%" >> /var/log/homelab-status.log
          echo "Memory: $(free | grep Mem | awk '{printf "%.1f%%", $3/$2 * 100.0}')" >> /var/log/homelab-status.log
          echo "Disk: $(df -h / | awk 'NR==2{print $5}')" >> /var/log/homelab-status.log
          echo "Load: $(uptime | awk -F'load average:' '{print $2}')" >> /var/log/homelab-status.log
          echo "Docker: $(docker ps --format 'table {{ "{{" }}.Names{{ "}}" }}\t{{ "{{" }}.Status{{ "}}" }}' 2>/dev/null | wc -l) containers" >> /var/log/homelab-status.log
          echo "K3s: $(k3s kubectl get nodes --no-headers 2>/dev/null | wc -l) nodes" >> /var/log/homelab-status.log
          echo "" >> /var/log/homelab-status.log
        dest: /usr/local/bin/homelab-monitor.sh
        mode: '0755'
        
    - name: Create monitoring cron job
      cron:
        name: "Homelab system monitoring"
        minute: "*/15"
        job: "/usr/local/bin/homelab-monitor.sh"
        
    # Journal size — the Pi keeps its journal on the SD card, and CrowdSec now
    # reads from it, so it is worth bounding rather than letting it grow.
    - name: Ensure the journald drop-in directory exists
      file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: '0755'
      tags: [journald]

    - name: Cap the systemd journal size
      copy:
        content: |
          [Journal]
          SystemMaxUse=1G
          SystemKeepFree=2G
          MaxRetentionSec=1month
        dest: /etc/systemd/journald.conf.d/00-homelab.conf
        mode: '0644'
      register: journald_conf
      tags: [journald]

    - name: Restart journald when the cap changes
      systemd:
        name: systemd-journald
        state: restarted
      when: journald_conf.changed
      tags: [journald]

    - name: Reclaim journal space beyond the cap
      command: journalctl --vacuum-size=1G
      register: journal_vacuum
      changed_when: "'Deleted archived journal' in journal_vacuum.stderr"
      tags: [journald]

    # Log rotation
    - name: Configure log rotation for homelab
      copy:
        content: |
          /var/log/homelab-status.log {
              daily
              rotate 7
              compress
              delaycompress
              missingok
              notifempty
              create 644 root root
          }
        dest: /etc/logrotate.d/homelab
        
  handlers:
    - name: restart ssh
      systemd:
        name: ssh
        state: restarted