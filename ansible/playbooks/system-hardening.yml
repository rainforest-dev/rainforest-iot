---
# System Hardening Playbook for Homelab
- name: Harden Raspberry Pi 5 Security
  hosts: raspberry_pi
  become: yes
  vars:
    allowed_ssh_users: ["rainforest"]
    ufw_enabled: true
    
  tasks:
    - name: Update all packages
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        autoclean: yes
        
    - name: Install security packages
      apt:
        name:
          - ufw
          - unattended-upgrades
          - logrotate
          - rkhunter
          - chkrootkit
        state: present
        
    # SSH Hardening
    - name: Configure SSH security
      blockinfile:
        path: /etc/ssh/sshd_config
        block: |
          # Security hardening
          PermitRootLogin no
          PasswordAuthentication no
          PubkeyAuthentication yes
          AllowUsers {{ allowed_ssh_users | join(' ') }}
          Protocol 2
          MaxAuthTries 3
          ClientAliveInterval 300
          ClientAliveCountMax 2
        marker: "# {mark} ANSIBLE MANAGED SSH SECURITY"
      notify: restart ssh
      
    # Firewall Configuration
    - name: Configure UFW defaults
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }
      when: ufw_enabled
      
    - name: Allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp
      when: ufw_enabled
      
    - name: Allow HTTP services
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'      # Homepage
        - '8080'    # Pi-hole
        - '8123'    # HomeAssistant
        - '8581'    # Homebridge
        - '21064'   # HomeKit Bridge (Home Assistant)
        - '3000'    # OpenSpeedTest
        - '3001'    # OpenSpeedTest HTTPS
        - '6443'    # K3s API
      when: ufw_enabled
      
    - name: Allow DNS (Pi-hole)
      ufw:
        rule: allow
        port: '53'
        proto: "{{ item }}"
      loop:
        - tcp
        - udp
      when: ufw_enabled
      
    - name: Allow K8s NodePort range
      ufw:
        rule: allow
        port: "30000:32767"
        proto: tcp
      when: ufw_enabled
      
    - name: Enable UFW
      ufw:
        state: enabled
        logging: 'on'
      when: ufw_enabled
      
    # Intrusion prevention: CrowdSec (Terraform module crowdsec) reading journald
    - name: Remove fail2ban
      apt:
        name: fail2ban
        state: absent
        purge: yes
      tags: [intrusion-prevention]

    - name: Remove the fail2ban config directory
      file:
        path: /etc/fail2ban
        state: absent
      tags: [intrusion-prevention]

    - name: Clear fail2ban's failed unit state
      command: systemctl reset-failed fail2ban.service
      register: fail2ban_reset
      changed_when: fail2ban_reset.rc == 0
      failed_when: false
      tags: [intrusion-prevention]

    - name: Check for a stray /var/log/auth.log
      stat:
        path: /var/log/auth.log
      register: auth_log
      tags: [intrusion-prevention]

    - name: Remove the /var/log/auth.log directory left by a Docker bind mount
      file:
        path: /var/log/auth.log
        state: absent
      when: auth_log.stat.isdir | default(false)
      tags: [intrusion-prevention]
      
    # Automatic Updates
    - name: Configure unattended upgrades
      copy:
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        
    - name: Configure unattended upgrades settings
      copy:
        content: |
          Unattended-Upgrade::Allowed-Origins {
              "${distro_id}:${distro_codename}";
              "${distro_id}:${distro_codename}-security";
              "${distro_id}ESMApps:${distro_codename}-apps-security";
              "${distro_id}ESM:${distro_codename}-infra-security";
          };
          Unattended-Upgrade::AutoFixInterruptedDpkg "true";
          Unattended-Upgrade::MinimalSteps "true";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
          Unattended-Upgrade::Automatic-Reboot "false";
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        
    # System Monitoring
    - name: Create system monitoring script
      copy:
        content: |
          #!/bin/bash
          # Homelab system monitoring
          echo "=== System Status $(date) ===" >> /var/log/homelab-status.log
          echo "CPU: $(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1)%" >> /var/log/homelab-status.log
          echo "Memory: $(free | grep Mem | awk '{printf "%.1f%%", $3/$2 * 100.0}')" >> /var/log/homelab-status.log
          echo "Disk: $(df -h / | awk 'NR==2{print $5}')" >> /var/log/homelab-status.log
          echo "Load: $(uptime | awk -F'load average:' '{print $2}')" >> /var/log/homelab-status.log
          echo "Docker: $(docker ps --format 'table {{ "{{" }}.Names{{ "}}" }}\t{{ "{{" }}.Status{{ "}}" }}' 2>/dev/null | wc -l) containers" >> /var/log/homelab-status.log
          echo "K3s: $(k3s kubectl get nodes --no-headers 2>/dev/null | wc -l) nodes" >> /var/log/homelab-status.log
          echo "" >> /var/log/homelab-status.log
        dest: /usr/local/bin/homelab-monitor.sh
        mode: '0755'
        
    - name: Create monitoring cron job
      cron:
        name: "Homelab system monitoring"
        minute: "*/15"
        job: "/usr/local/bin/homelab-monitor.sh"
        
    # Journal size — the Pi keeps its journal on the SD card, and CrowdSec now
    # reads from it, so it is worth bounding rather than letting it grow.
    - name: Ensure the journald drop-in directory exists
      file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: '0755'
      tags: [journald]

    - name: Cap the systemd journal size
      copy:
        content: |
          [Journal]
          SystemMaxUse=1G
          SystemKeepFree=2G
          MaxRetentionSec=1month
        dest: /etc/systemd/journald.conf.d/00-homelab.conf
        mode: '0644'
      register: journald_conf
      tags: [journald]

    - name: Restart journald when the cap changes
      systemd:
        name: systemd-journald
        state: restarted
      when: journald_conf.changed
      tags: [journald]

    - name: Reclaim journal space beyond the cap
      command: journalctl --vacuum-size=1G
      register: journal_vacuum
      changed_when: "'Deleted archived journal' in journal_vacuum.stderr"
      tags: [journald]

    # Log rotation
    - name: Configure log rotation for homelab
      copy:
        content: |
          /var/log/homelab-status.log {
              daily
              rotate 7
              compress
              delaycompress
              missingok
              notifempty
              create 644 root root
          }
        dest: /etc/logrotate.d/homelab
        
  handlers:
    - name: restart ssh
      systemd:
        name: ssh
        state: restarted