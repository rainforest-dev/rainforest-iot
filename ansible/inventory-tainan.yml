---
# Raspberry Pi 4 at the Tainan site. ansible_host is the ~/.ssh/config alias, which holds
# the LAN address and the relay through the NAS; see docs/tainan-site-setup.md.

all:
  children:
    tainan_pi:
      hosts:
        rpi4-tainan:
          ansible_host: rpi4-tainan
          ansible_user: rainforest
          # Tailscale (playbooks/tailscale.yml). The node name is the Pi's own hostname, so
          # the HA app can use http://raspberrypi-4:8123 from outside Tainan. MagicDNS stays
          # off: the Pi keeps the UCG's resolver, and a tailnet DNS change cannot break it.
          # The node carries tag:tainan, not tag:homelab: the tailnet policy opens only tcp:8123
          # on it, and keeps the Pi 5 rules (and the test that blocks 8123 there) separate.
          # First join or re-auth: sudo tailscale up --advertise-tags=tag:tainan
          tailscale_hostname: raspberrypi-4
          tailscale_accept_dns: false
