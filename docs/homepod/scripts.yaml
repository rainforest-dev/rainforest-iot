homepod_announce:
  alias: "HomePod Announce"
  description: "Speak a zh-TW message on the Bedroom HomePod through Music Assistant; MA restores the previous volume and resumes playback afterwards"
  icon: mdi:bullhorn
  mode: queued
  fields:
    message:
      name: Message
      required: true
      example: "該出門了"
      selector:
        text:
    volume:
      name: Volume
      default: 40
      selector:
        number:
          min: 10
          max: 100
  sequence:
    - variables:
        prev_volume: "{{ state_attr('media_player.bedroom_2', 'volume_level') }}"
    - action: media_player.play_media
      target:
        entity_id: media_player.bedroom_2
      data:
        media_content_id: "media-source://tts/tts.google_translate_en_com?message={{ message | urlencode }}&language=zh-tw"
        media_content_type: music
        announce: true
        extra:
          use_pre_announce: true
          announce_volume: "{{ volume | default(40) | int }}"
    - delay:
        seconds: 3
    - if:
        - condition: template
          value_template: >-
            {{ prev_volume is number and
               (state_attr('media_player.bedroom_2', 'volume_level') | float(-1) - prev_volume) | abs > 0.01 }}
      then:
        - action: media_player.volume_set
          target:
            entity_id: media_player.bedroom_2
          data:
            volume_level: "{{ prev_volume }}"

bambii_music_on:
  alias: "伴伴音樂"
  description: "Play Bambii's Spotify playlist on the Bedroom HomePod through Music Assistant"
  icon: mdi:dog
  mode: single
  fields:
    playlist:
      name: Spotify playlist URI
      default: "spotify:playlist:37i9dQZF1DX4sWSpwq3LiO"
      selector:
        text:
    volume:
      name: Volume
      default: 0.25
      selector:
        number:
          min: 0.05
          max: 1
          step: 0.05
  sequence:
    - action: media_player.volume_set
      target:
        entity_id: media_player.bedroom_2
      data:
        volume_level: "{{ volume | default(0.25) | float }}"
    - action: music_assistant.play_media
      target:
        entity_id: media_player.bedroom_2
      data:
        media_id: "{{ playlist | default('spotify:playlist:37i9dQZF1DX4sWSpwq3LiO') }}"
        media_type: playlist
        enqueue: replace

bambii_music_off:
  alias: "伴伴音樂停止"
  description: "Stop Bambii's music on the Bedroom HomePod"
  icon: mdi:dog-side-off
  mode: single
  sequence:
    - action: media_player.media_stop
      target:
        entity_id: media_player.bedroom_2
leave_reminder_check:
  alias: "該出門提醒檢查"
  description: "Announce on the Bedroom HomePod when it is time to leave for a calendar event with a location (start − Waze drive time − buffer; 30 min assumed when Waze finds no route)"
  icon: mdi:car-clock
  mode: single
  fields:
    dry_run:
      name: Dry run
      description: Log the message instead of announcing it
      default: false
      selector:
        boolean:
    buffer_minutes:
      name: Buffer (minutes)
      default: 10
      selector:
        number:
          min: 0
          max: 60
  sequence:
    - variables:
        calendars: "{{ states.calendar | map(attribute='entity_id') | list }}"
        buffer: "{{ buffer_minutes | default(10) | int }}"
    - condition: template
      value_template: "{{ calendars | count > 0 }}"
    - action: calendar.get_events
      target:
        entity_id: "{{ calendars }}"
      data:
        duration:
          hours: 4
      response_variable: agenda
    - variables:
        upcoming: >-
          {% set ns = namespace(items=[]) %}
          {% for cal in agenda.values() %}
            {% for e in cal.events if e.location is defined and e.location
                 and 'T' in e.start and as_datetime(e.start) > now() %}
              {% set ns.items = ns.items + [e] %}
            {% endfor %}
          {% endfor %}
          {{ ns.items }}
    - repeat:
        for_each: "{{ upcoming }}"
        sequence:
          - variables:
              key: "{{ as_timestamp(repeat.item.start) | int }}-{{ repeat.item.summary | replace(',', '') | truncate(12, true, '') }}"
          - condition: template
            value_template: "{{ key not in states('input_text.leave_reminder_announced').split(',') }}"
          - action: waze_travel_time.get_travel_times
            continue_on_error: true
            data:
              origin: zone.home
              destination: "{{ repeat.item.location }}"
              region: eu
            response_variable: route
          - variables:
              drive: >-
                {{ (route.routes[0].duration | round(0) | int)
                   if route is defined and route.routes is defined and route.routes | count > 0
                   else none }}
              leave_at: >-
                {{ (as_timestamp(repeat.item.start) - ((drive if drive is not none else 30) + buffer) * 60) | int }}
              message: >-
                {% set t = as_datetime(repeat.item.start) | as_local %}
                「{{ repeat.item.summary }}」{{ t.strftime('%H:%M') }}開始，
                {%- if drive is not none %}開車約 {{ drive }} 分鐘，{% endif %}該準備出門了
          - condition: template
            value_template: "{{ now().timestamp() >= leave_at }}"
          - if:
              - condition: template
                value_template: "{{ dry_run | default(false) }}"
            then:
              - action: system_log.write
                data:
                  level: warning
                  logger: leave_reminder
                  message: "DRY RUN: {{ message }}"
            else:
              - action: script.homepod_announce
                data:
                  message: "{{ message }}"
                  volume: 40
              - action: input_text.set_value
                target:
                  entity_id: input_text.leave_reminder_announced
                data:
                  value: >-
                    {{ ((states('input_text.leave_reminder_announced').split(',')
                        | reject('eq', '') | list)[-5:] + [key]) | join(',') }}

bedtime_reminder:
  alias: "睡前提醒"
  description: "Announce the start of the no-blue-light half hour on the Bedroom HomePod"
  icon: mdi:book-open-page-variant
  mode: single
  fields:
    dry_run:
      name: Dry run
      description: Log the message instead of announcing it
      default: false
      selector:
        boolean:
    volume:
      name: Volume
      default: 30
      selector:
        number:
          min: 10
          max: 100
  sequence:
    - variables:
        message: "十點半了，進入無藍光時間。放下手機，一起念小說吧，十一點睡覺。"
    - if:
        - condition: template
          value_template: "{{ dry_run | default(false) }}"
      then:
        - action: system_log.write
          data:
            level: warning
            logger: bedtime_reminder
            message: "DRY RUN: {{ message }} (volume {{ volume | default(30) | int }})"
      else:
        - action: script.homepod_announce
          data:
            message: "{{ message }}"
            volume: "{{ volume | default(30) | int }}"

sleep_podcast:
  alias: "Sleep Meditation"
  description: "Play the newest 【Vitamind 一起愛睏】 episode from the Vitamind 心理維他命 RSS feed on the Bedroom HomePod at a low volume, stop after a time limit, then restore the previous volume"
  icon: mdi:meditation
  mode: single
  fields:
    volume:
      name: Volume
      default: 0.2
      selector:
        number:
          min: 0.05
          max: 0.6
          step: 0.05
    title_match:
      name: Episode title contains
      default: "一起愛睏"
      selector:
        text:
    max_minutes:
      name: Stop after (minutes)
      default: 30
      selector:
        number:
          min: 1
          max: 90
  sequence:
    - variables:
        prev_volume: "{{ state_attr('media_player.bedroom_2', 'volume_level') }}"
    - action: rest_command.sleep_podcast_feed
      response_variable: feed
    - variables:
        episode: >-
          {% set items = (feed.content if feed.status == 200 and feed.content is string else '')
             | regex_findall('(?s)<item>.*?<title>(?:<!\\[CDATA\\[)?(.*?)(?:\\]\\]>)?</title>.*?<enclosure url="([^"]+)"') %}
          {% set match = title_match | default('一起愛睏') %}
          {% set ns = namespace(found=none) %}
          {% for t, u in items if ns.found is none and match in t and '訂閱制' not in t %}
            {% set ns.found = {'title': t, 'url': u} %}
          {% endfor %}
          {% for t, u in items if ns.found is none and '訂閱制' not in t %}
            {% set ns.found = {'title': t, 'url': u} %}
          {% endfor %}
          {{ ns.found }}
    - condition: template
      value_template: "{{ episode is mapping }}"
    - action: system_log.write
      data:
        level: info
        logger: sleep_podcast
        message: "Playing {{ episode.title }}"
    - action: media_player.volume_set
      target:
        entity_id: media_player.bedroom_2
      data:
        volume_level: "{{ volume | default(0.2) | float }}"
    - action: music_assistant.play_media
      target:
        entity_id: media_player.bedroom_2
      data:
        media_id: "{{ episode.url }}"
        media_type: track
        enqueue: replace
    - wait_template: "{{ is_state('media_player.bedroom_2', 'playing') }}"
      timeout: "00:00:30"
    - wait_template: "{{ not is_state('media_player.bedroom_2', 'playing') }}"
      timeout:
        minutes: "{{ max_minutes | default(30) | int }}"
    - if:
        - condition: state
          entity_id: media_player.bedroom_2
          state: playing
      then:
        - action: media_player.media_stop
          target:
            entity_id: media_player.bedroom_2
    - if:
        - condition: template
          value_template: "{{ prev_volume is number }}"
      then:
        - action: media_player.volume_set
          target:
            entity_id: media_player.bedroom_2
          data:
            volume_level: "{{ prev_volume }}"

wake_alarm:
  alias: "Wake Alarm"
  description: "Play a shuffled morning playlist on the Bedroom HomePod and raise the volume step by step; the ramp stops if playback stops or someone changes the volume"
  icon: mdi:alarm
  mode: single
  fields:
    playlist:
      name: Spotify playlist URI
      default: "spotify:playlist:3MpMZTJI3cgqU50A9kNPv7"
      selector:
        text:
    start_volume:
      name: Start volume
      default: 0.05
      selector:
        number:
          min: 0.01
          max: 0.3
          step: 0.01
    step:
      name: Step
      default: 0.015
      selector:
        number:
          min: 0.005
          max: 0.05
          step: 0.005
    max_volume:
      name: Max volume
      default: 0.35
      selector:
        number:
          min: 0.1
          max: 0.6
          step: 0.05
    interval_seconds:
      name: Step interval (seconds)
      default: 30
      selector:
        number:
          min: 5
          max: 120
  sequence:
    - variables:
        start: "{{ start_volume | default(0.05) | float }}"
        inc: "{{ step | default(0.015) | float }}"
        top: "{{ max_volume | default(0.35) | float }}"
        every: "{{ interval_seconds | default(30) | int }}"
    - action: media_player.volume_set
      target:
        entity_id: media_player.bedroom_2
      data:
        volume_level: "{{ start }}"
    - action: music_assistant.play_media
      target:
        entity_id: media_player.bedroom_2
      data:
        media_id: "{{ playlist | default('spotify:playlist:3MpMZTJI3cgqU50A9kNPv7') }}"
        media_type: playlist
        enqueue: replace
    - action: media_player.shuffle_set
      continue_on_error: true
      target:
        entity_id: media_player.bedroom_2
      data:
        shuffle: true
    - wait_template: "{{ is_state('media_player.bedroom_2', 'playing') }}"
      timeout: "00:00:30"
      continue_on_timeout: false
    - repeat:
        sequence:
          - delay:
              seconds: "{{ every }}"
          # MA reports volume in whole percent, so allow for rounding before calling it a manual change.
          - if:
              - condition: template
                value_template: >-
                  {{ not is_state('media_player.bedroom_2', 'playing') or
                     (state_attr('media_player.bedroom_2', 'volume_level') | float(-1)
                      - [start + inc * (repeat.index - 1), top] | min) | abs > 0.02 }}
            then:
              - stop: "Playback stopped or the volume was changed by hand"
          - action: media_player.volume_set
            target:
              entity_id: media_player.bedroom_2
            data:
              volume_level: "{{ [start + inc * repeat.index, top] | min | round(3) }}"
        until:
          - condition: template
            value_template: "{{ start + inc * repeat.index >= top - 0.0001 }}"
