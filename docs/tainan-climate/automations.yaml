# Replace the closet_dehumidify_* automations in /config/automations.yaml on the Tainan Pi 4
# with these (or paste each one in the HA UI's YAML editor), then reload automations.
#
# sensor.bedroom_humidity / sensor.bedroom_temperature come from configuration-snippet.yaml.
# Phone alerts go to notify.mobile_app_YOUR_PHONE: replace it with your phone's service
# (Developer tools → Actions, search "mobile_app") before pasting.

- id: closet_dehumidify_start
  alias: 衣櫥除濕 開始
  description: Room humidity above 70% for an hour starts the AC in dry mode, at most twice a day.
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.bedroom_humidity_1h_min
      above: 70
    # Re-check every 30 minutes, so a run blocked by the rest period starts once it is over.
    - trigger: time_pattern
      minutes: /30
  conditions:
    - condition: numeric_state
      entity_id: sensor.bedroom_humidity_1h_min
      above: 70
    # The 1h min keeps the Dyson's last value while it is offline; never start on stale data.
    - condition: template
      value_template: "{{ states('sensor.bedroom_humidity') | is_number }}"
    # Dry mode also cools; below 20 °C it would make the room cold for little gain.
    - condition: numeric_state
      entity_id: sensor.bedroom_temperature
      above: 20
    - condition: state
      entity_id: climate.leng_qi_ji
      state: "off"
    - condition: state
      entity_id: input_boolean.closet_dehumidify
      state: "off"
    - condition: state
      entity_id: input_boolean.closet_dehumidify_fault
      state: "off"
    # A few long runs a day dry the walls and clothes; short frequent ones only dry the air
    # and spend most of their power on compressor start-up.
    - condition: numeric_state
      entity_id: sensor.closet_dehumidify_runs_today
      below: 2
    - condition: template
      value_template: >
        {{ now() - states.input_boolean.closet_dehumidify.last_changed > timedelta(hours=6) }}
  actions:
    - action: input_number.set_value
      target: { entity_id: input_number.closet_dehumidify_start_humidity }
      data: { value: "{{ states('sensor.bedroom_humidity') | float | round(0) }}" }
    - action: input_boolean.turn_on
      target: { entity_id: input_boolean.closet_dehumidify }
    - action: climate.set_hvac_mode
      target: { entity_id: climate.leng_qi_ji }
      data: { hvac_mode: dry }
    - delay: { seconds: 30 }
    - action: climate.set_temperature
      target: { entity_id: climate.leng_qi_ji }
      # 2 °C under the room, at least 22 °C. At the room's own temperature the compressor
      # idles and the fan blows the coil's water back into the room (seen 2026-11-27).
      data:
        temperature: >
          {{ [22, (states('sensor.bedroom_temperature') | float(26) - 2) | round(0) | int] | max }}
    # 乾燥防霉 is a flag stored in the AC: once on, every power-off blows the coil dry.
    # The switch is only available while the AC is on, hence here and not at stop.
    - action: switch.turn_on
      target: { entity_id: switch.leng_qi_ji_gan_zao_fang_mei }
      continue_on_error: true

- id: closet_dehumidify_fallback
  alias: 衣櫥除濕 備援排程
  description: With no room humidity reading for 2 h, a humid day still gets one 2 h dry run at 14:00.
  mode: single
  triggers:
    - trigger: time
      at: "14:00:00"
  conditions:
    - condition: template
      value_template: >
        {{ states('sensor.bedroom_humidity') in ['unavailable', 'unknown']
           and now() - states.sensor.bedroom_humidity.last_changed > timedelta(hours=2) }}
    # Outdoor humidity from met.no: the room follows it when the AC is off.
    - condition: template
      value_template: "{{ state_attr('weather.forecast_home', 'humidity') | float(0) > 80 }}"
    - condition: numeric_state
      entity_id: sensor.bedroom_temperature
      above: 20
    - condition: state
      entity_id: climate.leng_qi_ji
      state: "off"
    - condition: state
      entity_id: input_boolean.closet_dehumidify
      state: "off"
    - condition: state
      entity_id: input_boolean.closet_dehumidify_fault
      state: "off"
  actions:
    # 0 tells the stop automation this run has no humidity to judge it by: it ends at 2 h.
    - action: input_number.set_value
      target: { entity_id: input_number.closet_dehumidify_start_humidity }
      data: { value: 0 }
    - action: input_boolean.turn_on
      target: { entity_id: input_boolean.closet_dehumidify }
    - action: climate.set_hvac_mode
      target: { entity_id: climate.leng_qi_ji }
      data: { hvac_mode: dry }
    - delay: { seconds: 30 }
    - action: climate.set_temperature
      target: { entity_id: climate.leng_qi_ji }
      # 2 °C under the room, at least 22 °C. At the room's own temperature the compressor
      # idles and the fan blows the coil's water back into the room (seen 2026-11-27).
      data:
        temperature: >
          {{ [22, (states('sensor.bedroom_temperature') | float(26) - 2) | round(0) | int] | max }}
    - action: switch.turn_on
      target: { entity_id: switch.leng_qi_ji_gan_zao_fang_mei }
      continue_on_error: true

- id: closet_dehumidify_stop
  alias: 衣櫥除濕 結束
  description: Ends a run this automation started, below 55% after at least 1 h, after 2 h (fallback) or 3 h.
  mode: single
  triggers:
    - trigger: numeric_state
      entity_id: sensor.bedroom_humidity
      below: 55
      for: { minutes: 10 }
    - trigger: state
      entity_id: input_boolean.closet_dehumidify
      to: "on"
      for: { hours: 2 }
    - trigger: state
      entity_id: input_boolean.closet_dehumidify
      to: "on"
      for: { hours: 3 }
    # HA drops the timers above on a restart or reload, so re-check every 10 minutes.
    - trigger: time_pattern
      minutes: /10
  conditions:
    - condition: state
      entity_id: input_boolean.closet_dehumidify
      state: "on"
  actions:
    - variables:
        ran_min: >
          {{ ((now() - states.input_boolean.closet_dehumidify.last_changed).total_seconds() / 60) | round(0) }}
        fallback: "{{ states('input_number.closet_dehumidify_start_humidity') | float(0) == 0 }}"
        dry_enough: "{{ ran_min >= 60 and states('sensor.bedroom_humidity') | float(100) < 55 }}"
        capped: "{{ ran_min >= 180 or (fallback and ran_min >= 120) }}"
    - condition: template
      value_template: "{{ dry_enough or capped }}"
    - if:
        - condition: state
          entity_id: climate.leng_qi_ji
          state: dry
      then:
        - action: climate.turn_off
          target: { entity_id: climate.leng_qi_ji }
    - action: input_boolean.turn_off
      target: { entity_id: input_boolean.closet_dehumidify }
    # A normal run reaching the cap without getting below 55% is worth knowing about.
    - if:
        - condition: template
          value_template: "{{ capped and states('sensor.bedroom_humidity') | float(100) >= 55 and not fallback }}"
      then:
        - action: notify.mobile_app_YOUR_PHONE
          data:
            title: 台南衣櫥除濕
            message: >
              除濕 3 小時仍未降到 55%（現在 {{ states('sensor.bedroom_humidity') }}%），已關冷氣。

- id: closet_dehumidify_no_progress
  alias: 衣櫥除濕 無效告警
  description: An hour in, humidity has not dropped 5 points from the start, so stop and flag a fault.
  mode: single
  triggers:
    - trigger: state
      entity_id: input_boolean.closet_dehumidify
      to: "on"
      for: { hours: 1 }
    - trigger: time_pattern
      minutes: /10
  conditions:
    - condition: state
      entity_id: input_boolean.closet_dehumidify
      state: "on"
    - condition: template
      value_template: >
        {% set start = states('input_number.closet_dehumidify_start_humidity') | float(0) %}
        {% set now_h = states('sensor.bedroom_humidity') %}
        {{ start > 0
           and now() - states.input_boolean.closet_dehumidify.last_changed > timedelta(hours=1)
           and now_h | is_number and now_h | float > start - 5 }}
  actions:
    - if:
        - condition: state
          entity_id: climate.leng_qi_ji
          state: dry
      then:
        - action: climate.turn_off
          target: { entity_id: climate.leng_qi_ji }
    - action: input_boolean.turn_off
      target: { entity_id: input_boolean.closet_dehumidify }
    - action: input_boolean.turn_on
      target: { entity_id: input_boolean.closet_dehumidify_fault }
    - action: notify.mobile_app_YOUR_PHONE
      data:
        title: 台南衣櫥除濕故障
        message: >
          除濕 1 小時，濕度只從 {{ states('input_number.closet_dehumidify_start_humidity') | int }}%
          降到 {{ states('sensor.bedroom_humidity') }}%，已關冷氣並暫停自動除濕。
          檢查門窗和冷氣後，到 HA 關掉「衣櫥除濕故障」。24 小時後會自動重試。

- id: closet_dehumidify_fault_reset
  alias: 衣櫥除濕 故障重置
  description: A fault left on for 24 h clears itself, so the closet is not left unprotected for good.
  mode: single
  triggers:
    - trigger: state
      entity_id: input_boolean.closet_dehumidify_fault
      to: "on"
      for: { hours: 24 }
    # HA drops the timer above on a restart or reload.
    - trigger: time_pattern
      minutes: /30
  conditions:
    - condition: state
      entity_id: input_boolean.closet_dehumidify_fault
      state: "on"
    - condition: template
      value_template: >
        {{ now() - states.input_boolean.closet_dehumidify_fault.last_changed >= timedelta(hours=24) }}
  actions:
    - action: input_boolean.turn_off
      target: { entity_id: input_boolean.closet_dehumidify_fault }

- id: closet_dehumidify_sensor_offline
  alias: 衣櫥除濕 感測器離線
  description: Tell the phone when no room humidity reading has arrived for 2 h (e.g. the Dyson unplugged).
  mode: single
  triggers:
    - trigger: state
      entity_id: sensor.bedroom_humidity
      to: [unavailable, unknown]
      for: { hours: 2 }
  actions:
    - action: notify.mobile_app_YOUR_PHONE
      data:
        title: 台南衣櫥除濕
        message: >
          房間濕度已 2 小時沒有讀數（Dyson 可能被拔掉）。
          期間只在室外濕度超過 80% 的日子，於 14:00 定時除濕 2 小時。

- id: closet_dehumidify_handover
  alias: 衣櫥除濕 交給手動
  description: Someone changed the AC away from dry mode, so the automation lets go of it.
  mode: single
  triggers:
    - trigger: state
      entity_id: climate.leng_qi_ji
      not_to: [dry, unavailable, unknown]
      # The cloud API can report the old mode for a moment while dry mode is being set.
      for: { minutes: 2 }
  conditions:
    - condition: state
      entity_id: input_boolean.closet_dehumidify
      state: "on"
  actions:
    - action: input_boolean.turn_off
      target: { entity_id: input_boolean.closet_dehumidify }
