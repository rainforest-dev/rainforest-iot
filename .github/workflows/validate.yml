name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        root: [".", "sites/tainan-rpi4"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: tfver
        run: echo "version=$(tr -d '[:space:]' < .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false
      - run: terraform version
      - run: terraform fmt -check -recursive
        working-directory: ${{ matrix.root }}
      - run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.root }}
      - run: terraform validate
        working-directory: ${{ matrix.root }}

  ansible:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - run: pip install ansible-core==2.21.4 yamllint==1.38.0
      - run: ansible-galaxy collection install community.docker:==5.3.0
      - name: Syntax-check every playbook
        working-directory: ansible
        run: |
          shopt -s nullglob
          files=(playbooks/*.yml)
          test "${#files[@]}" -gt 0
          for f in "${files[@]}"; do
            ansible-playbook -i inventory.yml --syntax-check "$f"
          done
      - run: yamllint -c .yamllint.yml docs ansible
